name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: node pwa-test.mjs
      - name: Install test browser
        run: |
          npx --yes playwright@1.58.2 install --with-deps chromium
          echo "CHROMIUM_BINARY=$(find "$HOME/.cache/ms-playwright" -name chrome -type f -print -quit)" >> "$GITHUB_ENV"
      - run: node browser-test.mjs
      - run: node offline-test.mjs
      - run: node build.mjs dist pages-release /music-canvas/
      - run: node offline-test.mjs /music-canvas/ pages-release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-release
  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
